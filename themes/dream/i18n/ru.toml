# Command descriptions
[gitsmith.cmd.init]
desc = "Инициализация нового Git-репозитория"
explain = "Создаёт новый репозиторий Git в указанной директории (или текущей). Создаёт папку .git с начальной структурой"

[gitsmith.cmd.clone]
desc = "Клонирование удалённого репозитория"
explain = "Создаёт полную копию удалённого репозитория локально, включая всю историю коммитов"

[gitsmith.cmd.status]
desc = "Показать состояние рабочего дерева"
explain = "Показывает какие файлы изменены, добавлены в staging или не отслеживаются"

[gitsmith.cmd.add]
desc = "Добавить файлы в staging area"
explain = "Добавляет файлы в индекс (staging area) для следующего коммита"

[gitsmith.cmd.commit]
desc = "Записать изменения в репозиторий"
explain = "Создаёт новый коммит с файлами из staging area и сообщением"

[gitsmith.cmd.push]
desc = "Отправить коммиты на удалённый сервер"
explain = "Загружает локальные коммиты в удалённый репозиторий"

[gitsmith.cmd.pull]
desc = "Получить и интегрировать изменения"
explain = "Скачивает изменения из удалённого репозитория и объединяет с текущей веткой (fetch + merge)"

[gitsmith.cmd.branch]
desc = "Управление ветками"
explain = "Создаёт, удаляет, переименовывает или показывает список веток"

[gitsmith.cmd.checkout]
desc = "Переключение между ветками/коммитами"
explain = "Переключает рабочее дерево на указанную ветку, тег или коммит"

[gitsmith.cmd.switch]
desc = "Переключение ветки (новая команда)"
explain = "Безопасная замена checkout для переключения веток (Git 2.23+)"

[gitsmith.cmd.merge]
desc = "Слияние веток"
explain = "Объединяет указанную ветку с текущей веткой"

[gitsmith.cmd.rebase]
desc = "Перебазирование коммитов"
explain = "Переносит коммиты текущей ветки поверх указанной. Переписывает историю!"

[gitsmith.cmd.cherryPick]
desc = "Применить отдельные коммиты"
explain = "Применяет изменения из указанных коммитов к текущей ветке"

[gitsmith.cmd.log]
desc = "Просмотр истории коммитов"
explain = "Показывает историю коммитов с различными опциями форматирования"

[gitsmith.cmd.diff]
desc = "Показать различия между файлами/коммитами"
explain = "Показывает изменения между рабочим деревом, staging area и коммитами"

[gitsmith.cmd.blame]
desc = "Показать кто изменял каждую строку"
explain = "Построчно показывает автора и коммит последнего изменения"

[gitsmith.cmd.show]
desc = "Показать объект (коммит, тег)"
explain = "Отображает информацию о коммите, теге или другом Git-объекте"

[gitsmith.cmd.stash]
desc = "Спрятать незакоммиченные изменения"
explain = "Сохраняет текущие изменения во временное хранилище и очищает рабочее дерево"

[gitsmith.cmd.reset]
desc = "Сброс HEAD к указанному состоянию"
explain = "Перемещает HEAD и опционально изменяет staging/рабочее дерево. Может удалить данные!"

[gitsmith.cmd.revert]
desc = "Отменить коммит новым коммитом"
explain = "Безопасно отменяет изменения коммита, создавая новый «обратный» коммит"

[gitsmith.cmd.restore]
desc = "Восстановить файлы"
explain = "Восстанавливает файлы из staging area или коммита (Git 2.23+)"

[gitsmith.cmd.clean]
desc = "Удалить неотслеживаемые файлы"
explain = "Удаляет файлы и директории, которые не находятся под контролем Git"

[gitsmith.cmd.remote]
desc = "Управление удалёнными репозиториями"
explain = "Добавляет, удаляет, переименовывает и просматривает удалённые репозитории"

[gitsmith.cmd.fetch]
desc = "Скачать объекты без слияния"
explain = "Загружает коммиты, файлы и ссылки из удалённого репозитория без слияния"

[gitsmith.cmd.submodule]
desc = "Управление подмодулями"
explain = "Инициализация, обновление и управление вложенными Git-репозиториями"

[gitsmith.cmd.rebaseI]
desc = "Интерактивный rebase"
explain = "Позволяет редактировать, объединять, удалять и переставлять коммиты в интерактивном режиме"

[gitsmith.cmd.bisect]
desc = "Бинарный поиск бага в истории"
explain = "Использует бинарный поиск для нахождения коммита, который ввёл баг"

[gitsmith.cmd.reflog]
desc = "Журнал ссылок (reflog)"
explain = "Показывает журнал всех перемещений HEAD — позволяет восстановить «потерянные» коммиты"

[gitsmith.cmd.tag]
desc = "Управление тегами"
explain = "Создаёт, удаляет и просматривает теги — метки для важных точек в истории"

